spring.application.name=payment

# Spring Cloud 호환성 체크 비활성화
spring.cloud.compatibility-verifier.enabled=false

# =======================================
# 🔍 상세 로깅 설정 (결제 및 통신 디버깅용)
# =======================================

# 기본 로깅 레벨 설정
logging.level.root=INFO
logging.level.com.popcorn.payment=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# HTTP 요청/응답 로깅
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.org.apache.http=DEBUG

# WebClient 및 외부 API 호출 로깅
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# 결제 관련 상세 로깅
logging.level.com.popcorn.payment.client=DEBUG
logging.level.com.popcorn.payment.service=DEBUG
logging.level.com.popcorn.payment.event=DEBUG
logging.level.com.popcorn.payment.controller=DEBUG

# 이벤트 관련 로깅
logging.level.org.springframework.context.event=DEBUG
logging.level.org.springframework.amqp=DEBUG

# 코루틴 및 비동기 처리 로깅
logging.level.kotlinx.coroutines=DEBUG
logging.level.reactor.core=DEBUG

# Circuit Breaker 및 Resilience4j 로깅
logging.level.io.github.resilience4j=DEBUG

# 토스페이먼츠 API 관련 로깅
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.http.client=DEBUG

# 로그 패턴 설정
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}:%line] - %msg%n

# 로그 파일 설정
logging.file.name=logs/payment-service.log
logging.file.max-size=100MB
logging.file.max-history=10

# 상세 에러 로깅
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator 상세 정보 (헬스체크 및 모니터링)
management.endpoints.web.exposure.include=health,info,metrics,loggers,httptrace
management.endpoint.health.show-details=always

# 웹 요청 추적
spring.mvc.log-request-details=true

# JSON 로깅으로 구조화된 로그 출력
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}:%line] - %msg%n
