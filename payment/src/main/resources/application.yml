# Payment Service 기본 설정
# 프로필별 상세 설정은 security/ 폴더 참조

server:
  port: 8085

spring:
  application:
    name: payment-service
  # 기본 프로필 설정
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# JWT 설정 (기존 backend와 동일한 secret 사용)

  # 설정 파일 import
  config:
    import:
      - classpath:security/application-${spring.profiles.active}.yml

  # 기본 데이터베이스 설정 (프로필별로 오버라이드 가능)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD:payment123}
    driver-class-name: org.postgresql.Driver

  # 기본 JPA 설정 (프로필별로 오버라이드 가능)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}  # 기본값은 validate
    show-sql: ${JPA_SHOW_SQL:true}        # 기본값은 true (개발용)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_FORMAT_SQL:true}  # 기본값은 true (개발용)

  # 기본 Flyway 설정
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE:true}
    locations: classpath:db/migration

  # Docker Compose 자동 실행 비활성화 (개발 편의성)
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_AUTO:false}  # Docker 자동 실행 끄기

  # Redis 설정 (결제 세션 캐싱용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Redis 패스워드 (필요시 설정)
      timeout: 2000ms
      database: 2  # Payment 서비스 전용 DB (0은 backend, 1은 order, 2는 payment)
      connection-timeout: 2000ms
      jedis:
        pool:
          max-active: 15
          max-idle: 10
          min-idle: 3
          max-wait: 3000ms

  # 캐시 설정
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5분 TTL (결제 세션은 짧게)
      cache-null-values: false

# 기본 로깅 설정 (프로필별로 오버라이드 가능)
logging:
  level:
    com.popcorn.payment: ${LOG_LEVEL_PAYMENT:DEBUG}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_BINDER:TRACE}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 관리용 엔드포인트 (모니터링)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI 문서 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 애플리케이션 정보
info:
  app:
    name: Payment Service
    description: 결제 관리 마이크로서비스
    version: 1.0.0

# Resilience4j 설정 (Circuit Breaker, Retry, Rate Limiter)
resilience4j:
  circuitbreaker:
    instances:
      orderService:
        failure-rate-threshold: 60
        minimum-number-of-calls: 5
        sliding-window-size: 15
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      tossPayments:
        failure-rate-threshold: 70  # 외부 결제 API는 더 관대하게
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 15s
      default:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
  retry:
    instances:
      orderService:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      tossPayments:
        max-attempts: 2  # 결제 API는 재시도 적게
        wait-duration: 3s
      default:
        max-attempts: 3
        wait-duration: 1s
  ratelimiter:
    instances:
      orderService:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 1s
      tossPayments:
        limit-for-period: 50  # 외부 결제 API 호출 제한
        limit-refresh-period: 1s
        timeout-duration: 2s

# 마이크로서비스 간 통신 설정
microservices:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8084}
    timeout: 30s
  checkins:
    base-url: ${CHECKINS_SERVICE_URL:http://localhost:8080/api/qr}
    timeout: 10s
  gateway:
    base-url: ${GATEWAY_URL:http://localhost:8080}
    timeout: 10s

# Toss Payments 설정 (환경별로 오버라이드)
toss:
  payments:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE:true}  # 기본값은 테스트 모드

# 커스텀 Payment 설정
payment:
  token:
    secret: ${PAYMENT_TOKEN_SECRET:change-me}
    ttl-minutes: ${PAYMENT_TOKEN_TTL_MINUTES:30}
  # Toss Payments 설정 (코루틴 클라이언트용)
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:test_secret_key}
    client-key: ${TOSS_CLIENT_KEY:test_client_key}
  # 결제 관련 비즈니스 설정
  webhook:
    timeout: ${PAYMENT_WEBHOOK_TIMEOUT:30000}  # 웹훅 타임아웃 (30초)
  validation:
    max-amount: ${PAYMENT_MAX_AMOUNT:500000}  # 최대 결제 금액 (50만원)
  notification:
    enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}  # 알림 활성화
    retry-count: ${PAYMENT_NOTIFICATION_RETRY:3}   # 알림 재시도 횟수
    timeout: 5000  # 알림 타임아웃 5초
  qr:
    enabled: true  # QR 코드 생성 활성화
    expiration-minutes: 10  # QR 코드 만료 시간 (10분)

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
