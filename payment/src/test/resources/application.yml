spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;IGNORE_UNKNOWN_SETTINGS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_schema: ""
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          auto: create-drop
        globally_quoted_identifiers: false
    show-sql: false

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: never

  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    com.popcorn.payment: ERROR