server:
  port: 8084

spring:
  config:
    activate:
      on-profile: local

  # 데이터베이스 설정 (로컬 환경용)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${ORDER_DB_USERNAME:order_app}
    password: ${ORDER_DB_PASSWORD:order123}
    driver-class-name: org.postgresql.Driver

  # JPA 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update  # 로컬에서는 update 사용
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: orders  # Order 서비스 전용 스키마

  # Flyway 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    user: ${ORDER_FLYWAY_USERNAME:order_migrator}
    password: ${ORDER_FLYWAY_PASSWORD:order321}
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/order
    schemas: orders  # Order 서비스 전용 스키마 사용
    default-schema: orders

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # DevTools 활성화
  devtools:
    restart:
      enabled: true

  # RabbitMQ 비활성화 (개발 환경)
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Redis 이벤트 설정
redis:
  events:
    enabled: true

# 로깅 설정 (로컬 환경용)
logging:
  level:
    com.popcorn.order: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

passport:
  secret: ${PASSPORT_SECRET:passport-shared-secret}
  ttl-seconds: 60

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000
  refresh-expiration-ms: 1209600000

# 마이크로서비스 간 통신 설정 (로컬용)
microservices:
  store:
    base-url: ${STORE_SERVICE_URL:http://localhost:8083}
    timeout: 30s
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8080}
    timeout: 30s
  user:
    base-url: http://localhost:8082
    timeout: 30s
  gateway:
    base-url: http://localhost:8080

order:
  payment:
    timeout: 60000  # 로컬에서는 긴 타임아웃
  cancel:
    timeout: 3600   # 로컬에서는 1시간
  validation:
    max-quantity: 1000  # 로컬에서는 더 큰 수량 허용
