spring.application.name=order-test

# 테스트용 포트 (랜덤 포트 사용)
server.port=0

# 테스트용 JWT 설정
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==
payment.token.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==

# Spring Cloud 호환성 체크 비활성화
spring.cloud.compatibility-verifier.enabled=false

# 테스트용 H2 데이터베이스 설정
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 설정
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 로깅 레벨 설정 (테스트용)
logging.level.root=WARN
logging.level.com.popcorn.order=DEBUG
logging.level.org.springframework.security=INFO

# Actuator 비활성화 (테스트용)
management.endpoints.enabled-by-default=false

# Swagger 비활성화 (테스트용)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false