server:
  port: 8082
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: checkIns
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${DB_USERNAME:qr_app}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  flyway:
    enabled: true
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    clean-disabled: false
    placeholders:
      QR_MIGRATOR_PASSWORD: ${QR_MIGRATOR_PASSWORD:qr321}
      QR_APP_PASSWORD: ${QR_APP_PASSWORD:qr123}

app:
  version: ${project.version:0.0.1-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.popcorn.checkIns: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web: DEBUG
    org.hibernate.SQL: DEBUG