server:
  port: ${SERVER_PORT:8086}
  shutdown: immediate
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${QR_DB_USERNAME:qr_app}
    password: ${QR_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  flyway:
    enabled: true
    locations: classpath:db/migration/schema
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    placeholders:
      QR_MIGRATOR_PASSWORD: ${QR_FLYWAY_PASSWORD}
      QR_APP_PASSWORD: ${QR_DB_PASSWORD}

logging:
  level:
    root: INFO
    com.popcorn.checkIns: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: WARN
    org.hibernate.SQL: WARN