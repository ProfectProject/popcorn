server:
  port: 0  # 테스트에서는 랜덤 포트 사용

spring:
  application:
    name: checkIns-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create-drop  # 테스트에서는 매번 테이블 재생성
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  flyway:
    enabled: false  # 테스트에서는 JPA가 스키마 생성

logging:
  level:
    root: WARN
    com.popcorn.checkIns: INFO
    org.springframework.web: WARN
    org.springframework.boot.web: WARN
    org.hibernate.SQL: WARN