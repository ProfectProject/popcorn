server:
  port: 8080

spring:
  application:
    name: gateway
  
  cloud:
    gateway:
      routes:
        - id: backend
          uri: http://localhost:8081     # 모놀리식 backend
          predicates:
            - Path=/api/v1/**               # /api 로 시작하면 backend로 라우팅
        - id: user-service
          uri: http://localhost:8082     # 모놀리식 backend
          predicates:
            - Path=/api/users/**               # /api 로 시작하면 backend로 라우팅
  webflux:
    base-path: /

springdoc:
  swagger-ui:
    urls:
      - name: Customer API
        url: /openapi/customer
      - name: Manager API
        url: /openapi/manager
      - name: Admin API
        url: /openapi/admin
        
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    reactor.netty.http.client: DEBUG
