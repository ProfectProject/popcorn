apiVersion: v1
kind: Namespace
metadata:
  name: popcorn
  labels:
    istio-injection: enabled  # Istio 사이드카 자동 주입
    name: popcorn
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: popcorn-config
  namespace: popcorn
data:
  # 데이터베이스 설정
  DB_HOST: "popcorn-postgres.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "popcorn"
  
  # Redis 설정
  REDIS_HOST: "popcorn-redis.default.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # Kafka 설정
  KAFKA_BROKER: "popcorn-kafka.default.svc.cluster.local:9092"
  
  # 서비스 URL (Kubernetes Service DNS)
  USER_SERVICE_URL: "http://user-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8084"
  PAYMENT_SERVICE_URL: "http://payment-service:8085"
  STORE_SERVICE_URL: "http://store-service:8083"
  CHECKIN_SERVICE_URL: "http://checkin-service:8086"
  ORDERQUERY_SERVICE_URL: "http://orderquery-service:8087"
  
  # Spring 프로파일
  SPRING_PROFILES_ACTIVE: "k8s"
---
apiVersion: v1
kind: Secret
metadata:
  name: popcorn-secrets
  namespace: popcorn
type: Opaque
stringData:
  # 데이터베이스 자격 증명
  DB_USERNAME: "postgres"
  DB_PASSWORD: "your-db-password"
  
  # JWT 시크릿
  JWT_SECRET: "your-jwt-secret-key"
  
  # Redis 비밀번호 (필요시)
  REDIS_PASSWORD: ""
  
  # 외부 API 키
  TOSS_PAYMENTS_SECRET_KEY: "your-toss-payments-secret"