name: Order Query Service CI/CD

on:
  push:
    branches: [develop, main, feature/*]
    paths:
      - 'orderQuery/**'
      - 'common-lib/**'
      - '.aws/task-definitions/order-query.json'
      - '.github/workflows/order-query.yml'
  pull_request:
    branches: [develop, main, feature/*]
    paths:
      - 'orderQuery/**'
      - 'common-lib/**'
      - '.aws/task-definitions/order-query.json'

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service-name: order-query
      service-directory: orderQuery
      ecr-repository: goorm-popcorn-order-query
      java-version: '17'
      gradle-build-args: 'bootJar -x test -x javadoc'
      needs-kafka: false
      enhanced-security: false
      min-approvals: 1
      discord-emoji: '📊'
    secrets: inherit
