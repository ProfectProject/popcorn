name: CheckIn Service CI/CD

on:
  push:
    branches: [develop, main, feature/*]
    paths:
      - 'checkIns/**'
      - 'common-lib/**'
      - '.aws/task-definitions/checkin-service.json'
      - '.github/workflows/checkin-service.yml'
  pull_request:
    branches: [develop, main, feature/*]
    paths:
      - 'checkIns/**'
      - 'common-lib/**'
      - '.aws/task-definitions/checkin-service.json'

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service-name: checkin-service
      service-directory: checkIns
      ecr-repository: goorm-popcorn-checkin
      java-version: '17'
      gradle-build-args: 'bootJar -x test -x javadoc'
      needs-kafka: false
      enhanced-security: false
      min-approvals: 1
      discord-emoji: '✅'
    secrets: inherit
