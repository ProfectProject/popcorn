name: Payment Service CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'payment/**'
      - '.aws/task-definitions/payment-service.json'
      - '.github/workflows/payment-service.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'payment/**'
      - '.aws/task-definitions/payment-service.json'

jobs:
  build-deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service-name: payment-service
      service-directory: payment
      ecr-repository: goorm-popcorn-payment
      java-version: '17'
      gradle-build-args: 'build -x test'
      needs-kafka: false
      enhanced-security: true
      min-approvals: 2
      discord-emoji: '🔒'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      PROD_APPROVERS: ${{ secrets.PROD_APPROVERS }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}