name: API Gateway CI/CD

on:
  push:
    branches: [develop, main, feature/*]
    paths:
      - 'gateway/**'
      - 'common-lib/**'
      - '.aws/task-definitions/api-gateway.json'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    branches: [develop, main, feature/*]
    paths:
      - 'gateway/**'
      - 'common-lib/**'
      - '.aws/task-definitions/api-gateway.json'

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service-name: api-gateway
      service-directory: gateway
      ecr-repository: goorm-popcorn-api-gateway
      java-version: '17'
      gradle-build-args: 'bootJar -x test -x javadoc'
      needs-kafka: false
      enhanced-security: false
      min-approvals: 1
      discord-emoji: '🚪'
    secrets: inherit
