name: API Gateway CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'gateway/**'
      - '.aws/task-definitions/api-gateway.json'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'gateway/**'
      - '.aws/task-definitions/api-gateway.json'

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: 375896310755
  SERVICE_NAME: api-gateway
  ECR_REPOSITORY: goorm-popcorn-api-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: goorm_popcorn_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        working-directory: gateway
        run: |
          ../gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: goorm_popcorn_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: API Gateway Tests
          path: gateway/build/test-results/test/*.xml
          reporter: java-junit

      - name: Code coverage
        working-directory: gateway
        run: ../gradlew jacocoTestReport

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: gateway/build/reports/jacoco/test/jacocoTestReport.xml
          flags: api-gateway

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=gateway/build.gradle

  build-and-deploy:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build application
        working-directory: gateway
        run: |
          chmod +x ../gradlew
          ../gradlew build -x test

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: gateway
        run: |
          docker build \
            --build-arg JAR_FILE=build/libs/*.jar \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Scan Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/Library/Caches:/root/.cache/ \
            aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/develop'
        working-directory: .aws
        run: |
          chmod +x deploy.sh
          ./deploy.sh ${{ env.SERVICE_NAME }} dev ${{ github.sha }}

      - name: Wait for manual approval (Production)
        if: github.ref == 'refs/heads/main'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Deploy ${{ env.SERVICE_NAME }} to Production"
          issue-body: |
            **Service**: ${{ env.SERVICE_NAME }}
            **Version**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            
            Please review and approve the production deployment.

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        working-directory: .aws
        run: |
          chmod +x deploy.sh
          ./deploy.sh ${{ env.SERVICE_NAME }} prod ${{ github.sha }}

      - name: Notify Discord
        if: always()
        uses: Ilshidur/action-discord@master
        with:
          args: |
            ${{ job.status == 'success' && '🚪✅' || '🚪❌' }} **${{ env.SERVICE_NAME }}** 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            
            **환경**: ${{ github.ref == 'refs/heads/main' && '🔴 Production' || '🟡 Staging' }}
            **버전**: `${{ github.sha }}`
            **작성자**: ${{ github.actor }}
            **브랜치**: ${{ github.ref_name }}
            **실행 시간**: ${{ github.run_number }}번째 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}