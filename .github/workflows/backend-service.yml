name: Backend Service CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.aws/task-definitions/backend-service.json'
      - '.github/workflows/backend-service.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.aws/task-definitions/backend-service.json'
    types: [opened, synchronize, reopened, ready_for_review]

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: 375896310755
  SERVICE_NAME: backend-service
  ECR_REPOSITORY: goorm-popcorn-backend

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: goorm_popcorn_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      kafka:
        image: confluentinc/cp-kafka:latest
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

      zookeeper:
        image: confluentinc/cp-zookeeper:latest
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Code Quality Check
        working-directory: backend
        run: |
          # Checkstyle for code style
          ../gradlew checkstyleMain checkstyleTest
          
          # SpotBugs for static analysis
          ../gradlew spotbugsMain spotbugsTest
        continue-on-error: false

      - name: Run tests
        working-directory: backend
        run: |
          ../gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: goorm_popcorn_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Service Tests
          path: backend/build/test-results/test/*.xml
          reporter: java-junit

      - name: Code coverage
        working-directory: backend
        run: ../gradlew jacocoTestReport

      - name: Check coverage threshold
        working-directory: backend
        run: |
          ../gradlew jacocoTestCoverageVerification
        env:
          COVERAGE_THRESHOLD: 80

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: backend/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend-service
          fail_ci_if_error: true

      - name: Integration Tests
        working-directory: backend
        run: |
          # API 테스트
          ../gradlew integrationTest
          
          # 데이터베이스 연동 테스트
          ../gradlew test --tests "*IntegrationTest"
        env:
          SPRING_PROFILES_ACTIVE: integration-test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: goorm_popcorn_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: SAST Security Scan
        working-directory: backend
        run: |
          # Static Application Security Testing
          ../gradlew sonarqube -Dsonar.projectKey=backend-service \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Dependency Vulnerability Scan
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/build.gradle

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: backend/build/reports/sonar/sonarqube.sarif
        continue-on-error: true

  build-and-deploy:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build application
        working-directory: backend
        run: |
          chmod +x ../gradlew
          ../gradlew build -x test

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          docker build \
            --build-arg JAR_FILE=build/libs/*.jar \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Scan Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/Library/Caches:/root/.cache/ \
            aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/develop'
        working-directory: .aws
        run: |
          chmod +x deploy.sh
          ./deploy.sh ${{ env.SERVICE_NAME }} dev ${{ github.sha }}

      - name: Wait for manual approval (Production)
        if: github.ref == 'refs/heads/main'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.PROD_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Deploy ${{ env.SERVICE_NAME }} to Production"
          issue-body: |
            **Service**: ${{ env.SERVICE_NAME }}
            **Version**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            
            Please review and approve the production deployment.

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        working-directory: .aws
        run: |
          chmod +x deploy.sh
          ./deploy.sh ${{ env.SERVICE_NAME }} prod ${{ github.sha }}

      - name: Create Release Tag
        if: github.ref == 'refs/heads/main' && job.status == 'success'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.SERVICE_NAME }}-v${{ github.run_number }}
          release_name: ${{ env.SERVICE_NAME }} Release v${{ github.run_number }}
          body: |
            ## ${{ env.SERVICE_NAME }} Release v${{ github.run_number }}
            
            **Deployed to Production**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            **Date**: ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Deployment Info
            - Environment: Production
            - Image Tag: ${{ github.sha }}
            - ECR Repository: ${{ env.ECR_REPOSITORY }}
          draft: false
          prerelease: false

      - name: Notify Discord
        if: always()
        uses: Ilshidur/action-discord@master
        with:
          args: |
            ${{ job.status == 'success' && '✅' || '❌' }} **${{ env.SERVICE_NAME }}** 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            
            **환경**: ${{ github.ref == 'refs/heads/main' && '🔴 Production' || '🟡 Staging' }}
            **버전**: `${{ github.sha }}`
            **작성자**: ${{ github.actor }}
            **브랜치**: ${{ github.ref_name }}
            **실행 시간**: ${{ github.run_number }}번째 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}