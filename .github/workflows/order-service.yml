name: Order Service CI/CD

on:
  push:
    branches: [develop, main, feature/*]
    paths:
      - 'order/**'
      - 'common-lib/**'
      - '.aws/task-definitions/order-service.json'
      - '.github/workflows/order-service.yml'
  pull_request:
    branches: [develop, main, feature/*]
    paths:
      - 'order/**'
      - 'common-lib/**'
      - '.aws/task-definitions/order-service.json'

jobs:
  build-deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service-name: order-service
      service-directory: order
      ecr-repository: goorm-popcorn-order
      java-version: '17'
      gradle-build-args: 'bootJar -x test -x javadoc'
      needs-kafka: true
      enhanced-security: false
      min-approvals: 1
      discord-emoji: '📦'
    secrets: inherit
