name: Secret Scan

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # 매일 오전 2시에 실행 (UTC)
    - cron: '0 2 * * *'

jobs:
  secret-scan:
    if: false
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 스캔을 위해

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: Check for hardcoded secrets in config files
        run: |
          echo "🔍 Checking for potential hardcoded secrets..."
          
          # Check for common secret patterns
          FINDINGS=0
          
          # JWT secrets
          if grep -r "jwt.*secret.*=" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.properties" .; then
            echo "⚠️  Found potential JWT secret in config files"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # Database passwords
          if grep -r "password.*=" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.properties" . | grep -v "valueFrom"; then
            echo "⚠️  Found potential database password in config files"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # API keys
          if grep -r -E "(api[_-]?key|secret[_-]?key|access[_-]?key)" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.properties" . | grep -v "valueFrom" | grep -v "secrets\."; then
            echo "⚠️  Found potential API key in config files"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          # Private keys
          if grep -r "BEGIN.*PRIVATE.*KEY" --include="*.pem" --include="*.key" --include="*.crt" .; then
            echo "⚠️  Found potential private key files"
            FINDINGS=$((FINDINGS + 1))
          fi
          
          if [ $FINDINGS -gt 0 ]; then
            echo "❌ Found $FINDINGS potential security issues"
            echo "Please review the findings above and ensure sensitive data is properly managed through GitHub Secrets or AWS Secrets Manager"
            exit 1
          else
            echo "✅ No hardcoded secrets found in config files"
          fi

      - name: Validate GitHub Secrets usage
        run: |
          echo "🔍 Validating GitHub Secrets usage in workflows..."
          
          # Check if all required secrets are referenced
          REQUIRED_SECRETS=(
            "AWS_ROLE_ARN"
            "DISCORD_WEBHOOK"
            "SNYK_TOKEN"
            "PROD_APPROVERS"
          )
          
          MISSING_SECRETS=0
          
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if ! grep -r "secrets\.$secret" .github/workflows/; then
              echo "⚠️  Required secret '$secret' not found in workflows"
              MISSING_SECRETS=$((MISSING_SECRETS + 1))
            else
              echo "✅ Secret '$secret' is properly referenced"
            fi
          done
          
          # Check for potential secret exposure in echo statements
          if grep -r "echo.*secrets\." .github/workflows/; then
            echo "❌ Found potential secret exposure in echo statements"
            exit 1
          fi
          
          if [ $MISSING_SECRETS -gt 0 ]; then
            echo "⚠️  $MISSING_SECRETS required secrets are not referenced in workflows"
            echo "This might indicate missing functionality or outdated secret names"
          fi
          
          echo "✅ GitHub Secrets validation completed"

      - name: Check AWS Secrets Manager references
        run: |
          echo "🔍 Checking AWS Secrets Manager references..."
          
          # Check Task Definition files for proper secret references
          if find .aws/task-definitions -name "*.json" -exec grep -l "valueFrom.*secretsmanager" {} \; | wc -l | grep -q "^[1-9]"; then
            echo "✅ Found AWS Secrets Manager references in Task Definitions"
            
            # List all secret references
            echo "📋 AWS Secrets Manager references found:"
            find .aws/task-definitions -name "*.json" -exec grep -H "valueFrom.*secretsmanager" {} \;
          else
            echo "⚠️  No AWS Secrets Manager references found in Task Definitions"
            echo "Consider moving sensitive environment variables to AWS Secrets Manager"
          fi

      - name: Generate Security Report
        if: always()
        run: |
          echo "# 🔒 Security Scan Report" > security-report.md
          echo "" >> security-report.md
          echo "**Scan Date**: $(date)" >> security-report.md
          echo "**Branch**: ${{ github.ref_name }}" >> security-report.md
          echo "**Commit**: ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          
          echo "## 📊 Scan Results" >> security-report.md
          echo "" >> security-report.md
          echo "- ✅ TruffleHog OSS scan completed" >> security-report.md
          echo "- ✅ GitLeaks scan completed" >> security-report.md
          echo "- ✅ Hardcoded secrets check completed" >> security-report.md
          echo "- ✅ GitHub Secrets validation completed" >> security-report.md
          echo "- ✅ AWS Secrets Manager check completed" >> security-report.md
          echo "" >> security-report.md
          
          echo "## 🔧 Recommendations" >> security-report.md
          echo "" >> security-report.md
          echo "1. Regularly rotate secrets (every 90 days)" >> security-report.md
          echo "2. Use AWS Secrets Manager for application secrets" >> security-report.md
          echo "3. Implement secret scanning in pre-commit hooks" >> security-report.md
          echo "4. Monitor secret access logs in CloudWatch" >> security-report.md
          echo "" >> security-report.md
          
          cat security-report.md

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report-${{ github.sha }}
          path: security-report.md
          retention-days: 30

      - name: Notify Discord (Security Scan)
        if: failure()
        uses: Ilshidur/action-discord@master
        with:
          args: |
            🚨 **Security Scan Alert** 🚨
            
            **Repository**: ${{ github.repository }}
            **Branch**: ${{ github.ref_name }}
            **Status**: ❌ Failed
            **Commit**: `${{ github.sha }}`
            **Author**: ${{ github.actor }}
            
            **Action Required**: Please review the security scan results and fix any identified issues.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify Discord (Success)
        if: success()
        uses: Ilshidur/action-discord@master
        with:
          args: |
            🔒 **Security Scan Complete** ✅
            
            **Repository**: ${{ github.repository }}
            **Branch**: ${{ github.ref_name }}
            **Status**: ✅ Passed
            **Commit**: `${{ github.sha }}`
            
            All security checks passed successfully.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
