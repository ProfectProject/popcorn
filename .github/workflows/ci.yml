name: MSA CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'users/**'
      - 'checkIns/**'
      - 'order/**'
      - 'store/**'
      - 'qr/**'
      - 'order_query/**'
      - 'common-lib/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'

  pull_request:
    branches: [develop, main]

permissions: 
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users:
              - 'users/**'
              - 'common-lib/**'

  ci-process:
    needs: detect-changes
    # 변경 사항이 있을 때만 실행
    if: needs.detect-changes.outputs.services != '[]'&& needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # true 테스트 실패 시 전체 파이프라인 중단
      matrix:
        # 감지된 서비스 리스트를 기반으로 병렬 작업 생성
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: popcorn_test
      DB_USERNAME: postgres
      DB_PASSWORD: test123
      USER_AUTH_DB_USERNAME: user_auth_app
      USER_AUTH_DB_PASSWORD: user123
      USER_AUTH_FLYWAY_USERNAME: user_auth_migrator
      USER_AUTH_FLYWAY_PASSWORD: user321
      SPRING_PROFILES_ACTIVE: test

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: popcorn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popcorn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build common-lib
        run: ./gradlew :common-lib:build -x test

      - name: Run Users Tests
        run: ./gradlew :users:test --tests "*" --fail-fast --info

      - name: Generate Coverage Report
        run: ./gradlew :users:jacocoTestReport

      - name: Verify Coverage (80% minimum)
        run: ./gradlew :users:jacocoTestCoverageVerification


      - name: Upload Users Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-test-results
          path: |
            users/build/reports/tests/test/
            users/build/test-results/test/
          retention-days: 7

      - name: Initialize DB Roles for Testing
        run: |
            # CI용 postgres 서비스에 접속하여 앱/마이그레이터 계정 미리 생성
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d popcorn_test -c "CREATE USER user_auth_app WITH PASSWORD 'user123';"
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d popcorn_test -c "CREATE USER user_auth_migrator WITH PASSWORD 'user321';"
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d popcorn_test -c "GRANT ALL PRIVILEGES ON DATABASE popcorn_test TO user_auth_migrator;"

      - name: Upload Users Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-coverage-report
          path: users/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const indexPath = 'checkIns/build/reports/jacoco/test/html/index.html';
              if (fs.existsSync(indexPath)) {
                const indexContent = fs.readFileSync(indexPath, 'utf8');
                const match = indexContent.match(/Total.*?(\d+)%/);
                if (match) {
                  const coverage = match[1];
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `## User Module Coverage Report 📊**Coverage: ${coverage}%** ${coverage >= 80 ? '✅' : '❌'}${coverage >= 80 ? 'Great! Coverage meets the 80% target.' : 'Coverage below 80% target.'}`
                  });
                }
              }
            } catch (error) {
              console.log('Could not post coverage comment:', error);
            }

  build-service:
    runs-on: ubuntu-latest
    needs: detect-changes
    name: Users Module Build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Users Module
        run: ./gradlew :users:build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: users-build
          path: users/build/libs/
          retention-days: 7

  docker-build-push-ecr:
    runs-on: ubuntu-latest
    needs: build-service
    name: Build & Push Users Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn-user
      SERVICE_DIR: users

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64

          provenance: false
          sbom: false

          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true
