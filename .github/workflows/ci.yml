name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: popcorn_test
      DB_USERNAME: postgres
      DB_PASSWORD: test123
      QR_DB_USERNAME: postgres
      QR_DB_PASSWORD: test123
      QR_FLYWAY_PASSWORD: test123
      SPRING_PROFILES_ACTIVE: test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: popcorn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popcorn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew (root)
        run: chmod +x gradlew

      - name: CheckIns Test & Coverage Verification
        run: ./gradlew :checkIns:test :checkIns:jacocoTestReport :checkIns:jacocoTestCoverageVerification

      - name: Payment Service Test & Coverage Verification
        working-directory: ./payment
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload checkIns Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkIns-coverage-report
          path: checkIns/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Upload checkIns Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkIns-test-results
          path: checkIns/build/reports/tests/test/
          retention-days: 7

      - name: Upload Payment Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-coverage-report
          path: payment/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Upload Payment Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-test-results
          path: payment/build/reports/tests/test/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/popcorn-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/popcorn-backend:${{ github.sha }}
