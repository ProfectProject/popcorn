name: CheckIns CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'users/**'

jobs:
  test-checkins:
    runs-on: ubuntu-latest
    name: CheckIns Module Test & Coverage

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: popcorn_test
      DB_USERNAME: postgres
      DB_PASSWORD: test123
      SPRING_PROFILES_ACTIVE: test

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: popcorn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popcorn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build common-lib
        run: ./gradlew :common-lib:build -x test

      - name: Run Users Tests
        run: ./gradlew :users:test --info

      - name: Generate Coverage Report
        run: ./gradlew :users:jacocoTestReport

      - name: Verify Coverage (80% minimum)
        run: ./gradlew :users:jacocoTestCoverageVerification


      - name: Upload CheckIns Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-test-results
          path: |
            users/build/reports/tests/test/
            users/build/test-results/test/
          retention-days: 7

      - name: Upload Users Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-coverage-report
          path: users/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const indexPath = 'checkIns/build/reports/jacoco/test/html/index.html';
              if (fs.existsSync(indexPath)) {
                const indexContent = fs.readFileSync(indexPath, 'utf8');
                const match = indexContent.match(/Total.*?(\d+)%/);
                if (match) {
                  const coverage = match[1];
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `## User Module Coverage Report 📊**Coverage: ${coverage}%** ${coverage >= 60 ? '✅' : '❌'}${coverage >= 60 ? 'Great! Coverage meets the 60% target.' : 'Coverage below 60% target.'}`
                  });
                }
              }
            } catch (error) {
              console.log('Could not post coverage comment:', error);
            }

  build-users:
    runs-on: ubuntu-latest
    needs: test-checkins
    name: Users Module Build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CheckIns Module
        run: ./gradlew :users:build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: users-build
          path: users/build/libs/
          retention-days: 7

  docker-build-push-ecr:
    runs-on: ubuntu-latest
    needs: build-users
    name: Build & Push Users Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn-user
      SERVICE_DIR: users

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64

          provenance: false
          sbom: false

          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true
