name: MSA CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'users/**'
      - 'checkIns/**'
      - 'order/**'
      - 'store/**'
      - 'qr/**'
      - 'order_query/**'
      - 'common-lib/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'

  pull_request:
    branches: [develop, main]

permissions: 
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users: ['users/**', 'common-lib/**']
            checkIns: ['checkIns/**', 'common-lib/**']
            order: ['order/**', 'common-lib/**']
            store: ['store/**', 'common-lib/**']
            qr: ['qr/**', 'common-lib/**']
            order_query: ['order_query/**', 'common-lib/**']

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: popcorn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popcorn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  build-service:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    name: Users Module Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Users Module
        run: ./gradlew :users:build -x test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: popcorn_test
          DB_USERNAME: postgres
          DB_PASSWORD: test123
          USER_AUTH_DB_USERNAME: user_auth_app
          USER_AUTH_DB_PASSWORD: user123
          USER_AUTH_FLYWAY_USERNAME: user_auth_migrator
          USER_AUTH_FLYWAY_PASSWORD: user321
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: users-build
          path: users/build/libs/
          retention-days: 7

  docker-build-push-ecr:
    runs-on: ubuntu-latest
    needs: build-service
    name: Build & Push Users Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn
      SERVICE_DIR: users

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64

          provenance: false
          sbom: false

          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-${{ matrix.service }}:test-${{ github.run_number }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true
