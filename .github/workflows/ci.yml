name: CheckIns CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'users/**'
      
jobs:
  test-checkins:
    runs-on: ubuntu-latest
    name: CheckIns Module Test & Coverage

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: popcorn_test
      DB_USERNAME: postgres
      DB_PASSWORD: test123
      QR_DB_USERNAME: postgres
      QR_DB_PASSWORD: test123
      QR_FLYWAY_PASSWORD: test123
      SPRING_PROFILES_ACTIVE: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: popcorn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popcorn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build common-lib
        run: ./gradlew :common-lib:build -x test

      - name: Run CheckIns Tests
        run: ./gradlew :checkIns:test --info

      - name: Generate Coverage Report
        run: ./gradlew :checkIns:jacocoTestReport

      - name: Verify Coverage (80% minimum)
        run: ./gradlew :checkIns:jacocoTestCoverageVerification

      - name: Upload Coverage to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./checkIns/build/reports/jacoco/test/jacocoTestReport.xml
          flags: checkins
          name: codecov-checkins
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload CheckIns Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkins-test-results
          path: |
            users/build/reports/tests/test/
            users/build/test-results/test/
          retention-days: 7

      - name: Upload CheckIns Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-coverage-report
          path: users/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const indexPath = 'checkIns/build/reports/jacoco/test/html/index.html';
              if (fs.existsSync(indexPath)) {
                const indexContent = fs.readFileSync(indexPath, 'utf8');
                const match = indexContent.match(/Total.*?(\d+)%/);
                if (match) {
                  const coverage = match[1];
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `## CheckIns Module Coverage Report 📊\n\n**Coverage: ${coverage}%** ${coverage >= 80 ? '✅' : '❌'}\n\n${coverage >= 80 ? 'Great! Coverage meets the 80% target.' : 'Coverage below 80% target.'}`
                  });
                }
              }
            } catch (error) {
              console.log('Could not post coverage comment:', error);
            }

  build-checkins:
    runs-on: ubuntu-latest
    needs: test-checkins
    name: CheckIns Module Build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CheckIns Module
        run: ./gradlew :checkIns:build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checkins-build
          path: checkIns/build/libs/
          retention-days: 7

  docker-build-push-ecr:
    runs-on: ubuntu-latest
    needs: build-checkins
    name: Build & Push CheckIns Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn-user
      SERVICE_DIR: users

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Dockerfile이 JAR를 COPY하므로, context는 repo root로 두는 게 안전함
          context: .
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          
          platforms: linux/amd64

          # ✅ ECR Scan 호환: OCI index 유발하는 attestation 끄기
          provenance: false
          sbom: false
          
					
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
          outputs: type=image,oci-mediatypes=true
