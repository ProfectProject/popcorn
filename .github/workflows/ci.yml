name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5430:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew (root)
        run: chmod +x gradlew

      - name: CheckIns Test & Coverage Verification
        run: ./gradlew :checkIns:test :checkIns:jacocoTestReport :checkIns:jacocoTestCoverageVerification

      - name: Upload checkIns Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkIns-coverage-report
          path: checkIns/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Upload checkIns Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkIns-test-results
          path: checkIns/build/reports/tests/test/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/popcorn-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/popcorn-backend:${{ github.sha }}
