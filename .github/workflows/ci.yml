name: CheckIns CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'checkIns/**'      # 실제 서비스 디렉토리에 맞춰 수정 (기존 users/** 에서 변경)
      - 'common-lib/**'
      - '.github/workflows/checkins-ci.yml'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'

jobs:
  # [1] 테스트 및 커버리지 확인
  test-checkins:
    runs-on: ubuntu-latest
    name: CheckIns Module Test & Coverage

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: popcorn_test
      DB_USERNAME: postgres
      DB_PASSWORD: test123
      QR_DB_USERNAME: postgres
      QR_DB_PASSWORD: test123
      QR_FLYWAY_PASSWORD: test123
      SPRING_PROFILES_ACTIVE: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: popcorn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popcorn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build common-lib
        run: ./gradlew :common-lib:build -x test

      - name: Run CheckIns Tests
        run: ./gradlew :checkIns:test --info

      - name: Generate Coverage Report
        run: ./gradlew :checkIns:jacocoTestReport

      - name: Verify Coverage (80% minimum)
        run: ./gradlew :checkIns:jacocoTestCoverageVerification

      - name: Upload CheckIns Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkins-test-results
          path: |
            checkIns/build/reports/tests/test/
            checkIns/build/test-results/test/
          retention-days: 7

  # [2] 빌드 단계 (JAR 생성)
  build-checkins:
    runs-on: ubuntu-latest
    needs: test-checkins
    name: CheckIns Module Build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CheckIns Module
        run: ./gradlew :checkIns:build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checkins-build
          path: checkIns/build/libs/
          retention-days: 7

  # [3] ECR 이미지 빌드 및 푸시
  docker-build-push-ecr:
    runs-on: ubuntu-latest
    needs: build-checkins
    name: Build & Push CheckIns Image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn-user
      SERVICE_DIR: checkIns  # Dockerfile이 있는 디렉토리로 통일

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC 인증 사용 시 Access Key는 생략하는 것이 보안상 좋으나, 필요시 유지
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64
          # ECR 호환성 핵심 설정
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:test-${{ github.run_number }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true
