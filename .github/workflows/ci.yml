name: MSA CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'users/**'
      - 'checkIns/**'
      - 'order/**'
      - 'store/**'
      - 'qr/**'
      - 'order_query/**'
      - 'common-lib/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
  pull_request:
    branches: [develop, main]

permissions: 
  contents: read
  id-token: write

jobs:
  # [1] 변화 감지
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users: ['users/**', 'common-lib/**']
            checkIns: ['checkIns/**', 'common-lib/**']
            order: ['order/**', 'common-lib/**']
            store: ['store/**', 'common-lib/**']
            qr: ['qr/**', 'common-lib/**']
            order_query: ['order_query/**', 'common-lib/**']

  # [2] 서비스 빌드
  build-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    
    name: Build ${{ matrix.service }} Module
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Module
        # ✅ 하드코딩된 :users 대신 matrix 변수 사용
        run: ./gradlew :${{ matrix.service }}:build -x test
        env:
          DB_HOST: localhost
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build
          path: ${{ matrix.service }}/build/libs/
          retention-days: 7

  # [3] Docker 빌드 및 푸시
  docker-build-push-ecr:
    needs: [detect-changes, build-service] # ✅ detect-changes가 필요함
    # develop 브랜치 푸시 시에만 작동
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ✅ 여기서도 matrix를 정의해야 ${{ matrix.service }}를 사용할 수 있습니다.
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    
    name: Push ${{ matrix.service }} to ECR
    
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: goorm-popcorn

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # ✅ 하드코딩된 users 대신 matrix 변수 사용
          file: ${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          
          # ✅ 요청하신 dev-latest 태그 적용
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-${{ matrix.service }}:dev-latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-${{ matrix.service }}:test-${{ github.run_number }}
          
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,oci-mediatypes=true
