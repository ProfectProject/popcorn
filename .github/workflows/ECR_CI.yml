name: popcorn-msa-ci-cd-optimized

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - 'users/**'
      - 'checkIns/**'
      - 'order/**'
      - 'stores/**'
      - 'payment/**'
      - 'orderQuery/**'
      - 'gateway/**'
      - 'common-lib/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 375896310755.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPO_PREFIX: goorm-popcorn
  COMMON_SECRET_ARN: arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN-DB-COMMON-aGIGrF

jobs:
  # [1] 변경된 서비스 감지 및 Matrix 생성
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users: ['users/**']
            checkIns: ['checkIns/**', 'common-lib/**', 'gradle/**', '*.gradle', 'gradle.properties']
            order: ['order/**', 'common-lib/**', 'gradle/**', '*.gradle', 'gradle.properties']
            stores: ['stores/**', 'common-lib/**', 'gradle/**', '*.gradle', 'gradle.properties']
            orderQuery: ['orderQuery/**', 'common-lib/**', 'gradle/**', '*.gradle', 'gradle.properties']
            gateway: ['gateway/**', 'common-lib/**', 'gradle/**', '*.gradle', 'gradle.properties']
            payment: ['payment/**', 'common-lib/**', 'gradle/**', '*.gradle', 'gradle.properties']

      - name: Configure AWS Credentials (IAM User)
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
            
      # ✅ 0. 공통 ENV 먼저 로드
      - name: Load Common Secrets Manager to ENV
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id POPCORN-DB-COMMON --query SecretString --output text)
          echo "$SECRET_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

          # ✅ 서비스별 전용 Secrets Manager 값 로드
      - name: Load Service Specific Secrets
        if: matrix.service.secretArn != ''
        run: |
          echo "Fetching secrets for ${{ matrix.service.name }}..."
          # 매트릭스에 정의된 secretArn을 사용하여 값을 가져옴
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id POPCORN_ORDER_QUERY --query SecretString --output text)
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id POPCORN_ORDER --query SecretString --output text)
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id POPCORN_QR --query SecretString --output text)
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id DB_STORE --query SecretString --output text)
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id POPCORN_USER --query SecretString --output text)
          
          # JSON의 Key-Value를 환경 변수 형태로 변환하여 GITHUB_ENV에 저장
          echo "$SECRET_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      
      - name: Build Matrix JSON
        id: set-matrix
        run: |
          SERVICES=()
          # 필터 키값(checkins, users 등)은 상단 filters 정의와 정확히 일치해야 함
          if [ "${{ steps.filter.outputs.users }}" = "true" ]; then
            SERVICES+=('{"name":"users","path":"users","type":"node","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN_USER-yQ38fS","ecrRegistry":"375896310755.dkr.ecr.ap-northeast-2.amazonaws.com/goorm-popcorn-user"}')
          fi

          if [ "${{ steps.filter.outputs.checkins }}" = "true" ]; then
            SERVICES+=('{"name":"checkIns","path":"checkIns","type":"gradle","gradleModule":"checkIns","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN_QR-GPInzQ"}')
          fi

          if [ "${{ steps.filter.outputs.order }}" = "true" ]; then
            SERVICES+=('{"name":"order","path":"order","type":"gradle","gradleModule":"order","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN_ORDER-cLSykH"}')
          fi

          if [ "${{ steps.filter.outputs.stores }}" = "true" ]; then
            SERVICES+=('{"name":"stores","path":"stores","type":"gradle","gradleModule":"stores","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:DB_STORE-3RCBYv"}')
          fi

          if [ "${{ steps.filter.outputs.orderQuery }}" = "true" ]; then
            SERVICES+=('{"name":"orderQuery","path":"orderQuery","type":"gradle","gradleModule":"orderQuery","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN_ORDER_QUERY-cLSykH"}')
          fi

          if [ "${{ steps.filter.outputs.gateway }}" = "true" ]; then
            SERVICES+=('{"name":"gateway","path":"gateway","type":"gradle","gradleModule":"gateway","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN_ORDER_QUERY-cLSykH"}')
          fi

          if [ "${{ steps.filter.outputs.payment }}" = "true" ]; then
            SERVICES+=('{"name":"payment","path":"payment","type":"gradle","gradleModule":"payment","secretArn":"arn:aws:secretsmanager:ap-northeast-2:375896310755:secret:POPCORN_ORDER-cLSykH"}')
          fi

          # 최종 매트릭스 생성
          MATRIX_JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -sc '.')
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "Final Matrix: ${MATRIX_JSON}"

  # [2] 빌드 및 배포
  ci-cd:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '' && needs.detect-changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ✅ 2. CI (테스트 단계)
      - name: Setup & Run Tests
        run: |
          if [ "${{ matrix.service.type }}" = "node" ]; then
            cd ${{ matrix.service.path }} && npm ci && npm test
          else
            chmod +x gradlew
            ./gradlew :${{ matrix.service.gradleModule }}:test \
              --stacktrace --info --no-daemon
          fi

      # ✅ 3. Docker Build & ECR Push (요청하신 포맷 이슈 해결 코드 포함)
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          REPO_NAME="${{ env.ECR_REPO_PREFIX }}-${{ matrix.service.name }}"
          aws ecr describe-repositories --repository-names ${REPO_NAME} || \
          aws ecr create-repository --repository-name ${REPO_NAME} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Check ECR Image Existence
        id: check_ecr  # ✅ 다음 단계에서 참조하기 위해 id를 지정합니다.
        run: |
          REPO_NAME="${{ env.ECR_REPO_PREFIX }}-${{ matrix.service.name }}"
          
          # 이미지 존재 여부 확인 (최근 1개만 조회)
          IMAGE_COUNT=$(aws ecr list-images --repository-name $REPO_NAME --max-items 1 --query 'imageIds' --output json)
          
          if [ "$IMAGE_COUNT" == "[]" ]; then
            echo "Repository is empty."
            echo "is_empty=true" >> "$GITHUB_OUTPUT"  # ✅ 결과를 Output에 저장
          else
            echo "Images found."
            echo "is_empty=false" >> "$GITHUB_OUTPUT" # ✅ 결과를 Output에 저장
          fi

      - name: Initial Build and Push
        # ✅ 'steps.아이디.outputs.변수명' 형식으로 접근합니다.
        if: steps.check_ecr.outputs.is_empty == 'true'
        run: echo "이 레포지토리는 비어있으므로 초기 배포를 진행합니다."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (ECR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
 
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_PREFIX }}-${{ matrix.service.name }}:test-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

#1

