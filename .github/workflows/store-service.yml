name: Store Service CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'stores/**'
      - '.aws/task-definitions/store-service.json'
      - '.github/workflows/store-service.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'stores/**'
      - '.aws/task-definitions/store-service.json'

jobs:
  build-deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      service-name: store-service
      service-directory: stores
      ecr-repository: goorm-popcorn-store
      java-version: '17'
      gradle-build-args: 'bootJar -x test -x javadoc'
      needs-kafka: false
      enhanced-security: false
      min-approvals: 1
      discord-emoji: '🏪'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      PROD_APPROVERS: ${{ secrets.PROD_APPROVERS }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}