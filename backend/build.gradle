plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'jacoco'
	id 'org.owasp.dependencycheck' version '11.1.0'
}

group = 'com.popcorn'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencyManagement {
	dependencies {
		dependency 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
		dependency 'org.apache.commons:commons-lang3:3.17.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// Swagger/OpenAPI 3 (Spring Boot 3.5.x 호환 버전)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// DB설정
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway
	implementation 'org.flywaydb:flyway-core:11.7.2'
	implementation 'org.flywaydb:flyway-database-postgresql:11.7.2'

	// Async 처리를 위한 의존성들
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

tasks.named('test') {
	useJUnitPlatform()
	// Suite 클래스는 개별 테스트 필터링 시 NoTestsDiscoveredException을 유발할 수 있어 제외
	// 단, --tests로 Suite 실행을 요청한 경우는 제외하지 않는다.
	doFirst {
		if (filter.commandLineIncludePatterns.isEmpty()) {
			exclude '**/*ApplicationTests.class'
		}
	}
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('processResources') {
	doFirst {
		delete(destinationDir)
	}
}

tasks.named('build') {
	dependsOn 'checkstyleMain'  // 가벼운 checkstyle 적용 (ignoreFailures = true)
	// checkstyleTest 제거 - 테스트 코드에는 스타일 체크 불필요
}

tasks.register('orderTest', Test) {
	useJUnitPlatform()
	include '**/*Order*'
}

checkstyle {
	toolVersion = '10.12.3'
	// 기본 Google 스타일 사용 - 가장 간단한 설정
	configFile = file("${rootProject.projectDir}/gradle/checkstyle-google.xml")
}

// checkstyle 가벼운 설정 적용 - CI 환경에서는 비활성화, 로컬에서만 실행
tasks.named('checkstyleMain') {
	// CI 환경에서는 완전히 비활성화 (설정 파일 경로 문제 방지)
	enabled = !System.getenv('CI')
	// 빌드 실패 방지 - 경고만 출력하고 빌드는 계속 진행
	ignoreFailures = true
}
tasks.named('checkstyleTest') {
	enabled = false
}

// ========================= OWASP Dependency Check 설정 =========================
dependencyCheck {
	format = 'ALL'
	outputDirectory = 'build/reports/dependency-check'
	scanConfigurations = ['runtimeClasspath']
	suppressionFile = 'config/dependency-check/suppressions.xml'

	analyzers {
		// 분석기 설정
		centralEnabled = true
		nexusEnabled = false
		pyDistributionEnabled = false
		pyPackageEnabled = false
		rubygemsEnabled = false
		opensslEnabled = false
		cmakeEnabled = false
		autoconfEnabled = false
		composerEnabled = false
		golangDepEnabled = false
		golangModEnabled = false
	}

	nvd {
		apiKey = System.getenv('NVD_API_KEY') ?: ''
		delay = 16000  // API 호출 간격 (밀리초)
		maxRetryCount = 3
	}
}

// ========================= 엣지 케이스 테스트 태스크 =========================
tasks.register('edgeCaseTest', Test) {
	description = '엣지 케이스 테스트 실행'
	group = 'verification'

	useJUnitPlatform()
	include '**/edgecase/**/*Test.class'

	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/tests/edgecase')
		junitXml.outputLocation = layout.buildDirectory.dir('test-results/edgecase')
	}
}

// ========================= 성능 테스트 태스크 =========================
tasks.register('performanceTest', Test) {
	description = '성능 테스트 실행'
	group = 'verification'

	useJUnitPlatform()
	include '**/performance/**/*Test.class'

	// 성능 테스트용 JVM 옵션
	maxHeapSize = '2g'
	jvmArgs = [
		'-XX:+UseG1GC',
		'-XX:MaxGCPauseMillis=200',
		'-XX:+PrintGCDetails',
		'-XX:+PrintGCTimeStamps'
	]

	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/tests/performance')
		junitXml.outputLocation = layout.buildDirectory.dir('test-results/performance')
	}
}

// ========================= 리그레션 테스트 태스크 =========================
tasks.register('regressionTest', Test) {
	description = '회귀 테스트 실행'
	group = 'verification'

	useJUnitPlatform()
	include '**/regression/**/*Test.class'

	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/tests/regression')
		junitXml.outputLocation = layout.buildDirectory.dir('test-results/regression')
	}
}

// ========================= 통합 테스트 태스크 =========================
tasks.register('integrationTest', Test) {
	description = '통합 테스트 실행'
	group = 'verification'

	useJUnitPlatform()
	include '**/*Integration*Test.class'

	reports {
		html.outputLocation = layout.buildDirectory.dir('reports/tests/integration')
		junitXml.outputLocation = layout.buildDirectory.dir('test-results/integration')
	}
}

// ========================= 전체 테스트 실행 태스크 =========================
tasks.register('fullTestSuite', Test) {
	description = '전체 테스트 스위트 실행 (단위 + 통합 + 엣지케이스 + 성능 + 회귀)'
	group = 'verification'

	dependsOn 'test', 'integrationTest', 'edgeCaseTest', 'performanceTest', 'regressionTest'

	finalizedBy 'jacocoTestReport'
}

// ========================= 테스트 품질 검증 태스크 =========================
tasks.register('testQualityCheck') {
	description = '테스트 품질 검증 (커버리지, 의존성 취약점 등)'
	group = 'verification'

	// CI 환경에서는 의존성 스캔 제외 (성능 향상)
	if (System.getenv('CI')) {
		dependsOn 'test', 'jacocoTestCoverageVerification'
	} else {
		dependsOn 'test', 'jacocoTestCoverageVerification', 'dependencyCheckAnalyze'
	}

	doLast {
		println '🎯 테스트 품질 검증 완료'
		println '  - 단위 테스트 실행됨'
		println '  - 코드 커버리지 검증됨'
		if (!System.getenv('CI')) {
			println '  - 의존성 취약점 스캔됨'
		}
	}
}

// ========================= 코드 커버리지 검증 설정 =========================
jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'BUNDLE'
			includes = [
				'com.popcorn.demo.domain.order*',
				'com.popcorn.demo.domain.popup*'
			]
			limit {
				minimum = 0.60  // 주문/팝업 도메인 80% 이상
			}
		}
		rule {
			enabled = true
			element = 'PACKAGE'
			includes = [
				'com.popcorn.demo.domain.order*',
				'com.popcorn.demo.domain.popup*'
			]

			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}
		}
	}
}

// ========================= 빌드 종속성 설정 =========================
tasks.named('build') {
	dependsOn 'checkstyleMain'  // 가벼운 checkstyle 적용 (ignoreFailures = true)
	// checkstyleTest 제거 - 테스트 코드에는 스타일 체크 불필요
	dependsOn 'testQualityCheck'
}

springBoot {
	mainClass = 'com.popcorn.demo.DemoApplication'
}
