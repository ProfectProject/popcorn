spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false  # 테스트에서는 Flyway 비활성화

  h2:
    console:
      enabled: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
