# Spring Boot 기본 설정
spring:
  application:
    name: popcorn-demo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  profiles:
    default: local

---
# Local 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-local.yml,optional:file:.env[.properties]
    activate:
      on-profile: local

---
# Development 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-dev.yml
    activate:
      on-profile: dev

---
# Production 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-prod.yml
    activate:
      on-profile: prod

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
