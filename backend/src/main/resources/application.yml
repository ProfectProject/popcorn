# Spring Boot 설정
spring:
  application:
    name: popcorn-demo

  # 기본 프로파일 설정
  profiles:
    default: local

---
# Local 환경 설정 (개발용)
spring:
  config:
    activate:
      on-profile: local

  # 데이터베이스 설정 (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/ttalkak_db
    username: ${DB_USERNAME:localhost}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  # JPA/Hibernate 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true
          order_inserts: true
          order_updates: true

  # Flyway 마이그레이션 설정
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public

  # 캐시 설정
  cache:
    type: simple

# 로깅 설정
logging:
  level:
    com.popcorn.demo: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Development 환경 설정
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/ttalkak_db
    username: ${DB_USERNAME:localhost}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: true
          order_inserts: true
          order_updates: true

logging:
  level:
    com.popcorn.demo: INFO
    org.springframework.security: WARN

---
# CI 환경 설정 (GitHub Actions용)
spring:
  config:
    activate:
      on-profile: ci

  # PostgreSQL 설정 (CI 서비스 사용)
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Flyway 설정 (CI용)
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema
    default-schema: public
    schemas: public

  # 캐시 설정
  cache:
    type: simple

logging:
  level:
    com.popcorn.demo: INFO
    org.springframework.security: WARN

---
# Production 환경 설정
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: true
          order_inserts: true
          order_updates: true

logging:
  level:
    com.popcorn.demo: WARN
    org.springframework.security: ERROR
