# Spring Boot 설정
spring:
  application:
    name: popcorn-demo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

  # 기본 프로파일 설정
  profiles:
    default: local

---
# Local 환경 설정 (개발용)
spring:
  config:
    activate:
      on-profile: local

  # 데이터베이스 설정 (PostgreSQL, R2DBC)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  # Flyway 마이그레이션 설정
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public

  # 캐시 설정
  cache:
    type: simple

# 로깅 설정
logging:
  level:
    com.popcorn.demo: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: ERROR
    org.springframework.data.r2dbc: DEBUG

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Development 환경 설정
spring:
  config:
    activate:
      on-profile: dev

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:popcorn_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

logging:
  level:
    com.popcorn.demo: INFO
    org.springframework.security: WARN

---
# CI 환경 설정 (GitHub Actions용)
spring:
  config:
    activate:
      on-profile: ci

  # PostgreSQL 설정 (CI 서비스 사용)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/popcorn_db
    username: testuser
    password: testpass
  datasource:
    url: jdbc:postgresql://localhost:5432/popcorn_db
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver

  # Flyway 설정 (CI용)
  flyway:
    url: jdbc:postgresql://localhost:5432/popcorn_db
    user: testuser
    password: testpass
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema
    default-schema: public
    schemas: public

  # 캐시 설정
  cache:
    type: simple

logging:
  level:
    com.popcorn.demo: INFO
    org.springframework.security: WARN

---
# Production 환경 설정
spring:
  config:
    activate:
      on-profile: prod

  r2dbc:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    url: ${DATABASE_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    com.popcorn.demo: WARN
    org.springframework.security: ERROR
