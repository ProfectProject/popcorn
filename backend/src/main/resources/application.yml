# Spring Boot 기본 설정
spring:
  application:
    name: popcorn-demo
  docker:
    compose:
      enabled: false
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  profiles:
    default: local

---
# Test 환경 설정 (H2 데이터베이스 강제 사용)
spring:
  config:
    activate:
      on-profile: test
redis:
  idempotency:
    clear-on-startup: true
  # H2 데이터베이스 설정
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=UUID;IGNORE_UNKNOWN_SETTINGS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: STRING
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

---
# Local 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-local.yml,optional:file:.env[.properties]
    activate:
      on-profile: local
redis:
  idempotency:
    clear-on-startup: true

  # Flyway 설정 (Local)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/schema
#      - classpath:db/migration/seed
    schemas: public
    create-schemas: true
    clean-disabled: false  # 개발 환경에서만 허용
---
# Development 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-dev.yml
    activate:
      on-profile: dev

  # Flyway 설정 (Dev)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/schema
#      - classpath:db/migration/seed
    schemas: public
    create-schemas: true
    clean-disabled: true  # 개발/운영 환경에서는 비활성화

---
# Production 환경 설정 (보안 설정 분리)
spring:
  config:
    import: classpath:security/application-prod.yml
    activate:
      on-profile: prod

  # Flyway 설정 (Prod)
  flyway:
    enabled: true
    baseline-on-migrate: false  # 운영 환경에서는 false
    locations:
      - classpath:db/migration/schema
#      - classpath:db/migration/seed
    schemas: public
    create-schemas: false  # 운영 환경에서는 false
    clean-disabled: true  # 운영 환경에서는 반드시 true
    validate-on-migrate: true  # 운영 환경에서 마이그레이션 검증

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    circuitbreakers:
      enabled: true

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: order

# ========================= Resilience4j 장애 복원력 설정 =========================
resilience4j:
  # Circuit Breaker 설정
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 50           # 실패율 50% 시 Circuit Open
        minimum-number-of-calls: 10          # 최소 호출 수
        sliding-window-size: 20              # 슬라이딩 윈도우 크기
        wait-duration-in-open-state: 10s     # Open 상태 유지 시간
        permitted-number-of-calls-in-half-open-state: 5  # Half-Open에서 허용할 호출 수
        automatic-transition-from-open-to-half-open-enabled: true

      # 마이크로서비스 Circuit Breaker 설정
      orderService:
        failure-rate-threshold: 60           # 주문 서비스는 더 관대하게
        minimum-number-of-calls: 5
        sliding-window-size: 15
        wait-duration-in-open-state: 10s
        register-health-indicator: true

      paymentService:
        failure-rate-threshold: 30           # 결제 서비스는 더 엄격하게
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 15s
        register-health-indicator: true

      gatewayService:
        failure-rate-threshold: 70           # 게이트웨이는 가장 관대하게
        minimum-number-of-calls: 10
        sliding-window-size: 20
        wait-duration-in-open-state: 5s
        register-health-indicator: true

      tossPaymentApi:                         # 🎯 TossPayments API 전용 설정
        failure-rate-threshold: 50           # 외부 API 50% 실패 시 열기
        slow-call-rate-threshold: 80         # 느린 호출 80% 시 열기
        slow-call-duration-threshold: 2000ms # 2초 이상 = 느린 호출
        minimum-number-of-calls: 5           # 최소 5번 호출 후 판단
        sliding-window-size: 10              # 10번 호출 기준
        wait-duration-in-open-state: 30s     # 30초 후 복구 시도
        permitted-number-of-calls-in-half-open-state: 3  # 복구 시 3번 테스트
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true      # 헬스체크 등록

  # Retry 설정
  retry:
    instances:
      default:
        max-attempts: 3                      # 최대 재시도 횟수
        wait-duration: 1s                    # 재시도 간격
        exponential-backoff-multiplier: 2    # 지수 백오프

      # 마이크로서비스 Retry 설정
      orderService:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

      paymentService:
        max-attempts: 5                      # 결제는 더 많이 재시도
        wait-duration: 2s
        exponential-backoff-multiplier: 2

      gatewayService:
        max-attempts: 2
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5

      tossPaymentApi:                        # 🎯 TossPayments API 재시도 설정
        max-attempts: 3                     # 최대 3회 시도 (원본 + 재시도 1회)
        wait-duration: 500ms                 # 재시도 간격 500ms
        enable-exponential-backoff: true     # 지수 백오프 활성화
        exponential-backoff-multiplier: 2    # 500ms → 1000ms

  # Rate Limiter 설정
  ratelimiter:
    instances:
      default:
        limit-for-period: 100                # 기간당 허용 요청 수
        limit-refresh-period: 1s             # 제한 갱신 주기
        timeout-duration: 0s                 # 타임아웃 (0s = 즉시 실패)

      # 마이크로서비스 Rate Limiter 설정
      orderApi:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 100ms

      paymentApi:
        limit-for-period: 20                 # 결제 API는 더 엄격하게
        limit-refresh-period: 1s
        timeout-duration: 200ms

      gatewayApi:
        limit-for-period: 100                # 게이트웨이는 더 관대하게
        limit-refresh-period: 1s
        timeout-duration: 50ms

  # Bulkhead 설정 (격리)
  bulkhead:
    instances:
      default:
        max-concurrent-calls: 25             # 최대 동시 호출 수
        max-wait-duration: 0s                # 대기 시간 없음

      # 마이크로서비스 Bulkhead 설정
      orderService:
        max-concurrent-calls: 15

      paymentService:
        max-concurrent-calls: 10             # 결제는 더 제한적으로

      gatewayService:
        max-concurrent-calls: 20             # 게이트웨이는 더 관대하게

  # Time Limiter 설정
  timelimiter:
    instances:
      default:
        timeout-duration: 2s                 # 기본 타임아웃
        cancel-running-future: true

      # 마이크로서비스 Time Limiter 설정
      orderService:
        timeout-duration: 3s
        cancel-running-future: true

      paymentService:
        timeout-duration: 5s                 # 결제는 더 오래 대기

      gatewayService:
        timeout-duration: 2s                 # 게이트웨이는 빠르게
        cancel-running-future: true

      tossPaymentApi:                        # 🎯 TossPayments API 타임아웃 설정
        timeout-duration: 5s                 # 외부 API 5초 타임아웃
        cancel-running-future: true          # 타임아웃 시 실행 중인 Future 취소

---
# 테스트 환경용 Resilience4j 설정
spring:
  config:
    activate:
      on-profile: test

resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 80           # 테스트에서는 더 관대하게
        minimum-number-of-calls: 3
        sliding-window-size: 5
        wait-duration-in-open-state: 2s

  retry:
    instances:
      default:
        max-attempts: 2                      # 테스트에서는 빠르게
        wait-duration: 100ms

---
# 스트레스 테스트용 Resilience4j 설정
spring:
  config:
    activate:
      on-profile: stress-test

resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 70           # 스트레스 테스트에서는 적당히
        minimum-number-of-calls: 20
        sliding-window-size: 50
        wait-duration-in-open-state: 1s      # 빠른 복구

      connectionTest:
        failure-rate-threshold: 60
        minimum-number-of-calls: 10
        sliding-window-size: 30
        wait-duration-in-open-state: 500ms   # 매우 빠른 복구

  ratelimiter:
    instances:
      default:
        limit-for-period: 1000               # 스트레스 테스트는 높은 처리량
        limit-refresh-period: 1s
        timeout-duration: 10ms

---
# Chaos Test 프로파일 설정
spring:
  config:
    activate:
      on-profile: chaos-test

# Chaos Monkey 설정 비활성화 (커스텀 구현 사용)
chaos:
  monkey:
    enabled: false

# Chaos Test용 Resilience4j 설정
resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 90           # 테스트에서는 매우 관대하게
        minimum-number-of-calls: 2
        sliding-window-size: 5
        wait-duration-in-open-state: 1s
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      default:
        max-attempts: 1                      # 테스트에서는 재시도 없음
        wait-duration: 100ms

---
# 기본 테스트 프로파일 설정
spring:
  config:
    activate:
      on-profile: test

# 기본 테스트 환경 설정 (application-test.yml이 추가 설정 제공)
jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000

toss:
  payments:
    base-url: https://api.tosspayments.com
    secret-key: test_toss_secret_key_for_testing_only
    client-key: test_toss_client_key_for_testing_only
