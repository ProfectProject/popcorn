# 🔔 AlertManager 극한 테스트 알람 설정
# 실시간 알람 라우팅 및 통합 관리

global:
  # 기본 SMTP 설정 (필요시 활성화)
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@popcorn-extreme.local'
  smtp_auth_username: ''
  smtp_auth_password: ''

# 알람 그룹핑 및 라우팅 규칙
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'

  routes:
    # 🚨 극한 부하 테스트 중요 알람
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m

    # ⚠️ 경고 수준 알람
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 30m

    # 📊 성능 메트릭 알람
    - match:
        category: performance
      receiver: 'performance-alerts'
      repeat_interval: 15m

# 알람 수신자 설정
receivers:
  # 기본 수신자 (로그만 출력)
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts/test'
        send_resolved: true

  # 중요 알람 수신자
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts/critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          극한 테스트 중 중요 알람 발생!

          알람명: {{ .GroupLabels.alertname }}
          서비스: {{ .GroupLabels.service }}
          클러스터: {{ .GroupLabels.cluster }}

          상세 정보:
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          {{ end }}

  # 경고 알람 수신자
  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts/warning'
        send_resolved: true

  # 성능 알람 수신자
  - name: 'performance-alerts'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts/performance'
        send_resolved: true

# 알람 억제 규칙 (중복 알람 방지)
inhibit_rules:
  # critical 알람이 활성화되면 warning 알람 억제
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

# 템플릿 설정 (선택사항)
templates:
  - '/etc/alertmanager/templates/*.tmpl'