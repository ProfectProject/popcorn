# 🚨 Popcorn 극한 테스트 알람 규칙
# 실시간 장애 감지 및 알림

groups:
  - name: popcorn.extreme.load.alerts
    interval: 5s
    rules:

    # 🔥 극한 부하 관련 알람
    - alert: ExtremeHighRequestRate
      expr: rate(http_server_requests_seconds_count[1m]) > 10000
      for: 30s
      labels:
        severity: critical
        category: extreme-load
      annotations:
        summary: "🔥 극한 요청률 감지!"
        description: "초당 {{ $value }} 요청으로 극한 부하 상태입니다. (임계값: 10,000 req/s)"

    - alert: ResponseTimeSpike
      expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[2m])) > 5
      for: 1m
      labels:
        severity: warning
        category: performance
      annotations:
        summary: "⚡ 응답 시간 급증!"
        description: "95% 응답 시간이 {{ $value }}초입니다. (임계값: 5초)"

    - alert: HighErrorRate
      expr: rate(http_server_requests_seconds_count{status=~"5.."}[2m]) / rate(http_server_requests_seconds_count[2m]) > 0.1
      for: 1m
      labels:
        severity: critical
        category: reliability
      annotations:
        summary: "❌ 높은 오류율 감지!"
        description: "5xx 오류율이 {{ $value | humanizePercentage }}입니다. (임계값: 10%)"

    # 🐒 Chaos Monkey 관련 알람
    - alert: ChaosMonkeyActive
      expr: chaos_monkey_assaults_total > 0
      for: 0s
      labels:
        severity: info
        category: chaos
      annotations:
        summary: "🐒 Chaos Monkey 활성!"
        description: "Chaos Monkey가 {{ $value }}회 공격을 실행했습니다."

    - alert: SystemUnderChaos
      expr: chaos_monkey_latency_active == 1 and chaos_monkey_exceptions_active == 1
      for: 0s
      labels:
        severity: warning
        category: chaos
      annotations:
        summary: "🌪️ 시스템이 Chaos 공격 중!"
        description: "지연 및 예외 공격이 동시에 활성화되어 있습니다."

    # 💾 리소스 사용량 알람
    - alert: HighMemoryUsage
      expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.9
      for: 2m
      labels:
        severity: critical
        category: resources
      annotations:
        summary: "🧠 메모리 사용량 위험!"
        description: "JVM 메모리 사용율이 {{ $value | humanizePercentage }}입니다. (임계값: 90%)"

    - alert: HighCpuUsage
      expr: process_cpu_usage > 0.8
      for: 2m
      labels:
        severity: warning
        category: resources
      annotations:
        summary: "💻 CPU 사용량 높음!"
        description: "CPU 사용율이 {{ $value | humanizePercentage }}입니다. (임계값: 80%)"

    - alert: DatabaseConnectionPoolExhausted
      expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
      for: 1m
      labels:
        severity: critical
        category: database
      annotations:
        summary: "💾 DB 커넥션 풀 고갈 위험!"
        description: "데이터베이스 커넥션 사용율이 {{ $value | humanizePercentage }}입니다."

    # 🚀 극한 테스트 전용 알람
    - alert: MillionUserTestActive
      expr: sum(rate(http_server_requests_seconds_count[1m])) > 50000
      for: 1m
      labels:
        severity: info
        category: extreme-test
      annotations:
        summary: "🌊 백만 사용자 테스트 감지!"
        description: "초당 {{ $value }} 요청으로 극한 테스트가 진행 중입니다."

    - alert: SystemSurvivingExtremeLoad
      expr: |
        (
          rate(http_server_requests_seconds_count[5m]) > 10000
          and
          rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) < 0.05
        )
      for: 5m
      labels:
        severity: info
        category: resilience
      annotations:
        summary: "🏆 시스템이 극한 부하를 버텨내고 있음!"
        description: "5분간 초당 {{ $value }} 요청을 5% 미만의 오류율로 처리 중입니다."

    # 🎯 비즈니스 메트릭 알람
    - alert: PaymentFailureSpike
      expr: increase(payment_failures_total[1m]) > 100
      for: 30s
      labels:
        severity: critical
        category: business
      annotations:
        summary: "💳 결제 실패 급증!"
        description: "지난 1분간 {{ $value }}건의 결제가 실패했습니다."

    - alert: OrderCreationStalled
      expr: rate(orders_created_total[2m]) == 0 and rate(http_server_requests_seconds_count{uri="/api/v1/orders"}[2m]) > 10
      for: 1m
      labels:
        severity: critical
        category: business
      annotations:
        summary: "📋 주문 생성 중단!"
        description: "주문 요청은 있지만 주문 생성이 중단되었습니다."

  # 🔔 시스템 복구 알람
  - name: popcorn.recovery.alerts
    interval: 10s
    rules:

    - alert: SystemRecovered
      expr: |
        (
          rate(http_server_requests_seconds_count{status=~"5.."}[2m]) / rate(http_server_requests_seconds_count[2m]) < 0.01
          and
          histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[2m])) < 1
        )
      for: 2m
      labels:
        severity: info
        category: recovery
      annotations:
        summary: "✅ 시스템 복구 완료!"
        description: "오류율이 1% 미만이고 95% 응답시간이 1초 미만으로 정상화되었습니다."

    - alert: LoadTestCompleted
      expr: rate(http_server_requests_seconds_count[1m]) < 100
      for: 5m
      labels:
        severity: info
        category: test-completion
      annotations:
        summary: "🎉 부하 테스트 완료!"
        description: "요청률이 분당 100개 미만으로 감소했습니다. 테스트가 완료된 것으로 보입니다."