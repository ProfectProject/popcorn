server:
  port: 8082
  shutdown: immediate
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:popcorn_db}
    username: ${STORE_DB_USERNAME:store_app}
    password: ${STORE_DB_PASSWORD:store123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR

  cache:
    type: simple

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5320}/${DB_NAME:popcorn_db}
    user: ${STORE_FLYWAY_USERNAME:store_migrator}
    password: ${STORE_FLYWAY_PASSWORD:store123}
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration/schema,classpath:db/migration/seed
    default-schema: store
    schemas: store
    clean-disabled: false


jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtZW52aXJvbm1lbnQtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 3600000

toss:
  payments:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    checkout-url: ${TOSS_PAYMENTS_CHECKOUT_URL}
    success-url: ${TOSS_PAYMENTS_SUCCESS_URL}
    fail-url: ${TOSS_PAYMENTS_FAIL_URL}
